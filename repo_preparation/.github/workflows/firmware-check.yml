name: MechTouch firmware build and OTA readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build CrowPanel Basic firmware
        run: pio run -e elecrow-crowpanel-7-basic
      - name: Produce readiness report (does not enable OTA)
        run: python scripts/ota_readiness.py .pio/build/elecrow-crowpanel-7-basic/firmware.bin single_app_4MB.csv > ota-readiness.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MechTouch-Basic-build
          path: |
            .pio/build/elecrow-crowpanel-7-basic/firmware.bin
            .pio/build/elecrow-crowpanel-7-basic/partitions.bin
            ota-readiness.txt
          if-no-files-found: error
